name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset windows

      - name: Build
        run: cmake --build --preset windows-release

      - name: Run DSP tests
        run: '& "build/windows/PracticeVibesTests_artefacts/Release/PracticeVibesTests.exe"'

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "build/windows/PracticeVibes_artefacts/Release/*" -DestinationPath PracticeVibes-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PracticeVibes-windows
          path: PracticeVibes-windows.zip

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset ios

      # Built unsigned: SideStore signs the app with the user's own Apple ID on install.
      - name: Build
        run: |
          cmake --build build/ios --config Release --target PracticeVibes -- \
            -sdk iphoneos -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP_PATH="$(find build/ios/PracticeVibes_artefacts -type d -name '*.app' | head -n 1)"
          echo "App bundle: $APP_PATH"
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry PracticeVibes.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PracticeVibes-ios
          path: PracticeVibes.ipa

  # Every push to main refreshes a "latest-build" pre-release, so the .ipa can be
  # downloaded straight from Safari on the iPad.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Replace the latest-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest-build --cleanup-tag --yes || true
          gh release create latest-build \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Automatic build of commit ${GITHUB_SHA::7}. Not a stable release." \
            PracticeVibes.ipa PracticeVibes-windows.zip
